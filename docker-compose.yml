name: roam-bupt

services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: roam_bupt
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    environment:
      # 健康检查里的 redis-cli 需要这个变量
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 不把 ES 放进依赖：搜索是可降级能力，ES 没起来后端也应该能启动
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ROAM_DB_HOST: mysql
      ROAM_DB_PORT: "3306"
      ROAM_DB_NAME: roam_bupt
      ROAM_DB_USER: root
      ROAM_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      ROAM_REDIS_HOST: redis
      ROAM_REDIS_PORT: "6379"
      ROAM_REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      ROAM_ES_HOST: elasticsearch
      ROAM_ES_PORT: "9200"
      ROAM_JWT_SECRET: ${ROAM_JWT_SECRET:?请在 .env 里设置 ROAM_JWT_SECRET（至少 32 字节）}
      ROAM_TRUST_XFF: "true"
      ROAM_WRITE_PER_MINUTE: ${ROAM_WRITE_PER_MINUTE:-30}
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ./frontend
    volumes:
      # nginx 配置挂载进来：改缓存/反代规则不用重建镜像
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  mysql-data:
  redis-data:
  es-data:
  uploads-data:
