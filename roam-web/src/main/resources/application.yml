server:
  port: 8080

spring:
  application:
    name: roam-bupt
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  liquibase:
    enabled: true
    change-log: classpath:liquibase/master.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
