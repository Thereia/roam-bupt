server:
  port: 8080

spring:
  application:
    name: roam-bupt
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 12MB
  liquibase:
    enabled: true
    change-log: classpath:liquibase/master.xml
  rabbitmq:
    host: ${ROAM_RABBIT_HOST:192.168.153.129}
    port: ${ROAM_RABBIT_PORT:5672}
    username: ${ROAM_RABBIT_USER:admin}
    password: ${ROAM_RABBIT_PASSWORD:admin}
    # 发布确认 + mandatory：消息没到交换机/队列时要能落库重投
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    virtual-host: ${ROAM_RABBIT_VHOST:/}
    listener:
      simple:
        # 手动 ACK：消费成功才 ack，失败由消费者重试 3 次后 nack，进死信队列
        acknowledge-mode: manual

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # ES 是可降级依赖：不可用时搜索走 MySQL，但不能让健康检查把整个应用判死
    elasticsearch:
      enabled: false

roam:
  jwt:
    # 仅本地开发默认值；生产必须通过 ROAM_JWT_SECRET 注入（至少 32 字节）
    secret: ${ROAM_JWT_SECRET:roam-bupt-dev-secret-change-me-please-32}
    ttl: 7d
  auth:
    # 认证是安全边界，Redis 不可用时默认拒绝（503），不默认放行
    redis-fail-open: ${ROAM_AUTH_REDIS_FAIL_OPEN:false}
    login-limit-per-minute: 5
    exclude-paths:
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /actuator/**
  notify:
    mq:
      # 默认关：本地没 RabbitMQ 也能跑；生产由 compose 打开
      enabled: ${ROAM_NOTIFY_MQ_ENABLED:false}
      exchange: roam.notify.exchange
      queue: roam.notify.queue
      routing-key: roam.notify.created
      dlx: roam.notify.dlx
      dead-queue: roam.notify.dead.queue
      dead-routing-key: roam.notify.dead
  search:
    vector:
      # 语义召回：开启后索引写 embedding，检索走 BM25 + kNN + RRF
      enabled: ${ROAM_SEARCH_VECTOR_ENABLED:false}
      endpoint: ${ROAM_EMBEDDING_ENDPOINT:https://open.bigmodel.cn/api/paas/v4/embeddings}
      api-key: ${ROAM_EMBEDDING_API_KEY:}
      model: ${ROAM_EMBEDDING_MODEL:embedding-3}
      dims: 1024
      timeout-ms: 8000
      top-k: 50
      # 融合窗口：两路各取到"本页末尾"（照 taco，上限 500）；深翻页退化成纯 BM25
      fusion-window: ${ROAM_SEARCH_FUSION_WINDOW:500}
      # 语义那一路的打折系数，字面命中优先
      semantic-weight: ${ROAM_SEARCH_SEMANTIC_WEIGHT:0.7}
      semantic-fallback: 12
  security:
    # 部署在可信代理（nginx 等）后面时才开；开了以后只信任 trusted-proxies 里的来源
    trust-forwarded-for: ${ROAM_TRUST_XFF:false}
    trusted-proxies: ${ROAM_TRUSTED_PROXIES:}
    write-per-minute: ${ROAM_WRITE_PER_MINUTE:30}
