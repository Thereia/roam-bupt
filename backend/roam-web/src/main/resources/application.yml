server:
  port: 8080

spring:
  application:
    name: roam-bupt
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 12MB
  liquibase:
    enabled: true
    change-log: classpath:liquibase/master.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # ES 是可降级依赖：不可用时搜索走 MySQL，但不能让健康检查把整个应用判死
    elasticsearch:
      enabled: false

roam:
  jwt:
    # 仅本地开发默认值；生产必须通过 ROAM_JWT_SECRET 注入（至少 32 字节）
    secret: ${ROAM_JWT_SECRET:roam-bupt-dev-secret-change-me-please-32}
    ttl: 7d
  auth:
    # 认证是安全边界，Redis 不可用时默认拒绝（503），不默认放行
    redis-fail-open: ${ROAM_AUTH_REDIS_FAIL_OPEN:false}
    login-limit-per-minute: 5
    exclude-paths:
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /actuator/**
