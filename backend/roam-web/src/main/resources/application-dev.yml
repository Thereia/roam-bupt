spring:
  datasource:
    url: jdbc:mysql://${ROAM_DB_HOST:localhost}:${ROAM_DB_PORT:3306}/${ROAM_DB_NAME:roam_bupt}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${ROAM_DB_USER:root}
    # 仅本地开发默认值；生产必须走环境变量
    password: ${ROAM_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${ROAM_REDIS_HOST:192.168.153.129}
      port: ${ROAM_REDIS_PORT:7001}
      # 仅本地开发默认值；生产必须走环境变量
      password: ${ROAM_REDIS_PASSWORD:123456}
      connect-timeout: 2s
      timeout: 3s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

logging:
  level:
    com.roambupt: info

roam:
  post:
    # 本地开发直接上线，省掉审核步骤；生产默认进 PENDING
    auto-approve: ${ROAM_POST_AUTO_APPROVE:true}

  upload:
    dir: ./uploads
    allowed-prefix: /files/
    max-size-mb: 5

  search:
    enabled: ${ROAM_SEARCH_ENABLED:true}
    host: ${ROAM_ES_HOST:192.168.153.129}
    # VM 上项目自己的 ES 发布在 19200（taco 那套 9200 已退役）
    port: ${ROAM_ES_PORT:19200}
    # 本地开发单独一个索引，避免和 VM 部署的文档混在一起
    index: ${ROAM_ES_INDEX:roam_post_local}
    connect-timeout-ms: 1000
    socket-timeout-ms: 2000
